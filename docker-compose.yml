services:
  student-analytics:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./oulad_raw:/app/oulad_raw:ro
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    restart: unless-stopped
