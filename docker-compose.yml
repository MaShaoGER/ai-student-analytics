services:
  student-analytics:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./oulad_raw:/app/oulad_raw:ro
      - records:/app/records
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      APP_STATE_DIR: /app/records/system
      APP_ORIGIN: ${APP_ORIGIN:-}
      APP_SETTINGS_KEY: ${APP_SETTINGS_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_INPUT_PRICE: ${OPENAI_INPUT_PRICE:-}
      OPENAI_OUTPUT_PRICE: ${OPENAI_OUTPUT_PRICE:-}
    restart: unless-stopped
    # Same probe and thresholds as the image HEALTHCHECK; keeping them explicit makes
    # `docker compose up -d --build --wait` wait for a servable app, and lets an
    # environment tighten or loosen them. `running` alone is not readiness.
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  records:
    driver: local
