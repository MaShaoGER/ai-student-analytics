<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观数 · 学习过程图表研究</title>
<style>
:root{--bg:#f5f5f2;--ink:#232329;--muted:#8a8a94;--accent:#7666cc;--line:#24243615}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'PingFang SC','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.page{width:1440px;max-width:100%;margin:auto;padding:34px 54px 35px}.top{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted)}.brand{display:flex;gap:11px;align-items:center;font-size:19px;font-weight:600;letter-spacing:.14em;color:var(--ink)}.brand-mark{width:24px;height:27px;transform:skewY(-18deg) rotate(-15deg);border:1px solid #24243655;border-radius:5px;box-shadow:5px -4px #7666cc12,5px -4px 0 1px #7666cc44}.top-right{display:flex;gap:20px;align-items:center}.dot{height:5px;width:5px;background:var(--accent);display:inline-block;border-radius:50%;margin-right:7px}.hero{display:flex;align-items:end;justify-content:space-between;margin:42px 0 23px}.eyebrow{font-size:9px;letter-spacing:.15em;color:var(--muted);margin:0 0 12px}.hero h1{font-size:34px;font-weight:450;letter-spacing:-.04em;margin:0}.hero h1 span{font-family:'Songti SC','STSong',serif;font-weight:400}.hero p{font-size:11px;line-height:1.9;color:var(--muted);margin:14px 0 0}.glass{border:1px solid #ffffffca;background:linear-gradient(125deg,#ffffffc4,#ffffff35 60%,#e8e5f333);box-shadow:0 7px 30px #17172605,inset 0 1px #fff;backdrop-filter:blur(15px);border-radius:40px;position:relative}.glass:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 -1px 1px #c1bae877,inset 1px 0 1px #f3d9db99}.controls{display:flex;align-items:center;gap:18px;padding:12px 17px;font-size:11px}select{border:0;outline:none;background:transparent;max-width:190px;padding:3px 20px 3px 0}.scope{display:flex;gap:30px;padding:16px 0 20px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}.scope strong{color:var(--ink);font-size:16px;font-weight:500;margin-right:6px}.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:55px;row-gap:18px}.figure{margin:0;padding:26px 0 12px;min-width:0}.figure:nth-child(-n+2){border-bottom:1px solid var(--line)}.figure-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.figure-head h2{font-size:17px;font-weight:500;letter-spacing:.01em;margin:0 0 7px}.figure-head h2 span{color:var(--muted);font-size:10px;font-weight:400;margin-right:12px}.figure-head p{font-size:10px;line-height:1.8;color:var(--muted);margin:0}.badge{font-size:8px;color:var(--accent);border:1px solid #7666cc24;border-radius:30px;padding:6px 10px;white-space:nowrap}.plot{position:relative;margin-top:10px;height:310px;isolation:isolate}.plot.galaxy{height:330px}.plot svg{width:100%;height:100%;display:block;overflow:visible}.plot:after{content:'';position:absolute;inset:10px -4px;backdrop-filter:blur(4px);mask-image:radial-gradient(ellipse at center,transparent 60%,#000 105%);pointer-events:none;z-index:1}.caption{font-size:9px;line-height:1.9;color:var(--muted);margin:9px 0 0}.caption b{color:var(--ink);font-weight:500}.chart-label{font-size:10px;fill:#70707a}.small-label{font-size:8px;fill:#93939c}.chart-number{font-size:17px;fill:var(--ink);font-weight:450;letter-spacing:-.5px}.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:13px;font-size:9px;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}.terrain-stats{display:flex;gap:22px;color:var(--muted);font-size:9px;margin:0 0 6px}.terrain-stats b{font-size:12px;font-weight:500;color:var(--ink);margin-left:5px}.bottom{display:flex;justify-content:space-between;padding-top:16px;margin-top:10px;border-top:1px solid var(--line);font-size:9px;color:var(--muted);gap:25px;line-height:1.8}.hint{font-size:8px;letter-spacing:.1em}.node{cursor:pointer}.node:focus-visible circle{stroke:var(--accent);stroke-width:2;outline:none}.node:hover circle{stroke:var(--accent);stroke-width:1.7}.selected-node circle{stroke:var(--accent);stroke-width:2}.swatch-bar{height:4px;width:65px;display:inline-block;background:linear-gradient(90deg,#f0eff6,#7666cc);border-radius:10px;margin:0 5px;vertical-align:middle}.network-glow{filter:blur(9px);opacity:.17}.panel-stat{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums}.plot .grid-line{stroke:#23233912;stroke-width:.7}.plot .link{fill:none;stroke:#777089;stroke-opacity:.2;stroke-width:.8}.plot .link-focus{stroke:var(--accent);stroke-opacity:.4}.figure-note{font-size:8px;color:var(--muted);text-align:right}.status{min-height:17px;font-size:9px;color:var(--accent);margin-top:7px}.reset{background:transparent;border:0;font-size:9px;color:var(--muted);padding:0 0 2px;border-bottom:1px solid #aaa3}.focus-info{display:flex;gap:14px;align-items:center;justify-content:space-between}.focus-info .status{flex:1}.empty{fill:#aaa;font-size:11px;text-anchor:middle}@media(max-width:900px){.page{padding:25px}.hero{gap:25px;align-items:start;flex-direction:column}.hero h1{font-size:29px}.grid{grid-template-columns:1fr;gap:0}.figure{border-bottom:1px solid var(--line)}.scope{gap:16px;flex-wrap:wrap}.top-right .hint{display:none}.bottom{flex-direction:column;gap:7px}}
</style></head><body><main class="page">
<header class="top"><div class="brand"><span class="brand-mark"></span>观数<span class="hint" style="font-size:8px;color:var(--muted);font-weight:400;letter-spacing:.08em;margin-left:7px">LEARNING PROCESS STUDY</span></div><div class="top-right"><span><i class="dot"></i>合成数据 · 图表研究</span><span class="hint">2025J / 16 WEEKS</span></div></header>
<section class="hero"><div><p class="eyebrow">FROM RESULTS TO THE LEARNING JOURNEY</p><h1>一门课的学习，<span>可以这样看。</span></h1><p>把阶段成绩、知识点与每天的学习行为，连成同一条探索路径。</p></div><div class="controls glass"><span>当前课程</span><select id="course" aria-label="选择展示课程"></select><span>↗</span></div></section>
<div class="scope"><span><strong id="students"></strong>名选课学生</span><span><strong>4</strong>次阶段测评</span><span><strong>6</strong>个知识点</span><span><strong>12</strong>道评分练习</span><span><strong id="activity"></strong>次活动</span><span id="scope-note"></span></div>
<section class="grid">
<figure class="figure"><header class="figure-head"><div><h2><span>01</span>成绩流河</h2><p>看同一组选课学生，怎样经过四次阶段测评。</p></div><span class="badge">宽度 → 人数</span></header><div class="plot" id="flow"></div><div class="legend" id="flow-legend"></div><figcaption class="caption">每条带连接相邻阶段的成绩区间，<b>未测单列</b>；少于3人的连接隐藏。悬停查看人数。</figcaption></figure>
<figure class="figure"><header class="figure-head"><div><h2><span>02</span>知识点星图</h2><p>从课程展开知识点，再深入它对应的练习。</p></div><span class="badge">大小 → 覆盖人数</span></header><div class="plot galaxy" id="galaxy"></div><div class="focus-info"><p class="status" id="knowledge-status">点选知识点，查看练习得分与覆盖样本。</p><button class="reset" id="reset-focus">恢复全图</button></div><figcaption class="caption">连线来自明确的<b>课程—知识点—题目归属</b>；节点透明度反映练习得分，不表示因果关系。</figcaption></figure>
<figure class="figure"><header class="figure-head"><div><h2><span>03</span>学习活动地形</h2><p>让16周的日级资源活动，在空间中升起。</p></div><span class="badge">高度 → 活动量</span></header><div class="plot" id="terrain"></div><div class="terrain-stats" id="activity-kinds"></div><figcaption class="caption">每根柱对应<b>一周中的一天</b>；高度使用统一的 log(1+活动量) 尺度，跨课程保持一致。悬停查看日期。</figcaption></figure>
<figure class="figure"><header class="figure-head"><div><h2><span>04</span>阶段成绩轨迹</h2><p>看均分，也看它周围的分布。</p></div><span class="badge">带宽 → 分布区间</span></header><div class="plot" id="trajectory"></div><div class="legend"><span><i style="background:#7666cc"></i>当期均分</span><span><i style="background:#dcd6ee"></i>25%–75%分位区间</span><span id="phase-counts"></span></div><figcaption class="caption">各阶段只统计有分学生，样本数随缺测变化。<b>零分保留，缺测不补零。</b></figcaption></figure>
</section><footer class="bottom"><span>全部为虚构校园数据；图形直接读取新增 CSV 的聚合结果。切换课程会改变分布、流向、节点与地形。</span><span>黑白基底 / 光感玻璃 / 局部色散 / 边缘渐进虚化</span></footer>
</main><script id="study-data" type="application/json">__LEARNING_PROCESS_PAYLOAD__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('study-data').textContent),$=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const colors={'90–100':'#6d5eab','75–89':'#9c8fc1','60–74':'#b3b4bd','<60':'#c8c8ce','未测':'#e5e4e8'};
const fmt=n=>n===null?'隐藏':Number(n).toLocaleString('zh-CN');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(w,h,body,label)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`;
let current,focus=null;
function flow(c){
 const xs=[40,225,410,595],bands=data.bandNames,scale=220/c.n,pad=9,positions=[];
 let s=`<defs>${bands.map((b,i)=>`<linearGradient id="fg${i}"><stop stop-color="${colors[b]}" stop-opacity=".5"/><stop offset="1" stop-color="${colors[b]}" stop-opacity=".21"/></linearGradient>`).join('')}</defs>`;
 for(let st=0;st<4;st++){let y=37;positions[st]={};s+=`<text x="${xs[st]}" y="13" text-anchor="middle" class="chart-label">${data.stageNames[st]}</text><text x="${xs[st]}" y="28" text-anchor="middle" class="small-label">W${(st+1)*4}</text>`;for(const band of bands){let n=c.phases[st].bands[band]||0;positions[st][band]={y,h:n*scale,out:0,into:0};y+=n*scale+(n?pad:0);}}
 for(let st=1;st<4;st++){let edges=c.flows.filter(e=>e.stage===st&&e.count!==null).sort((a,b)=>bands.indexOf(a.source)-bands.indexOf(b.source)||bands.indexOf(a.target)-bands.indexOf(b.target));for(const e of edges){let a=positions[st-1][e.source],b=positions[st][e.target],h=e.count*scale,ay=a.y+a.out,by=b.y+b.into,x=xs[st-1]+5,x2=xs[st]-5,m=(x+x2)/2;a.out+=h;b.into+=h;s+=`<path d="M${x},${ay} C${m},${ay} ${m},${by} ${x2},${by} L${x2},${by+h} C${m},${by+h} ${m},${ay+h} ${x},${ay+h} Z" fill="url(#fg${bands.indexOf(e.source)})" stroke="${colors[e.source]}" stroke-width=".35" stroke-opacity=".25"><title>${data.stageNames[st-1]} ${e.source} → ${data.stageNames[st]} ${e.target}：${e.count} 人</title></path>`;}}
 for(let st=0;st<4;st++)for(const band of bands){const p=positions[st][band],n=c.phases[st].bands[band];if(n)s+=`<rect x="${xs[st]-4}" y="${p.y}" width="8" height="${Math.max(p.h,.8)}" rx="2" fill="${colors[band]}"><title>${data.stageNames[st]} ${band}：${n} 人</title></rect>`;}
 $('flow').innerHTML=svg(640,320,s,'相邻阶段成绩区间的人数流向图');$('flow-legend').innerHTML=bands.map(b=>`<span><i style="background:${colors[b]}"></i>${esc(b)}</span>`).join('');
}
function galaxy(c){
 let s=`<defs><radialGradient id="opal"><stop stop-color="#fff"/><stop offset=".7" stop-color="#ece8f6"/><stop offset="1" stop-color="#d4d7e9"/></radialGradient></defs><circle cx="320" cy="166" r="121" fill="none" stroke="#7666cc12" stroke-dasharray="2 6"/><circle cx="320" cy="166" r="56" fill="url(#opal)" opacity=".5" stroke="#bbb1d833"/><text x="320" y="163" text-anchor="middle" class="chart-label" style="font-size:13px;fill:#333">${esc(c.name)}</text><text x="320" y="182" text-anchor="middle" class="small-label">${c.n} 名选课学生</text>`;
 const maxN=Math.max(...c.points.map(p=>p.n||0),1);
 for(let i=0;i<c.points.length;i++){const p=c.points[i],angle=(-90+i*60)*Math.PI/180,x=320+Math.cos(angle)*143,y=166+Math.sin(angle)*115,active=focus===null||focus===p.id,r=p.n===null?10:Math.sqrt(p.n/maxN)*24,opacity=active?1:.15;
 s+=`<g opacity="${opacity}"><path class="link ${focus===p.id?'link-focus':''}" d="M320,166 Q${320+(x-320)*.65+20},${166+(y-166)*.35} ${x},${y}"/>`;
 for(let j=0;j<p.items.length;j++){const q=p.items[j],a=angle+(j?1:-1)*.13,qx=320+Math.cos(a)*207,qy=166+Math.sin(a)*153,qr=3+q.difficulty*5;s+=`<path class="link" d="M${x},${y} L${qx},${qy}"/><circle cx="${qx}" cy="${qy}" r="${qr}" fill="#7666cc" opacity="${.12+(q.mean||0)/160}"><title>${esc(q.title)}；最新练习均分 ${q.mean??'隐藏'}；覆盖 ${q.n??'隐藏'} 人；难度设定 ${q.difficulty}</title></circle>`;}
 s+=`<g class="node ${focus===p.id?'selected-node':''}" tabindex="0" role="button" data-point="${p.id}" aria-label="${esc(p.name)}，练习均分${p.mean??'隐藏'}"><circle cx="${x}" cy="${y}" r="${r+5}" fill="#a99adb" class="network-glow"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#opal)" fill-opacity="${.25+(p.mean||0)/160}" stroke="#b6abd3" stroke-opacity=".4"/><text x="${x}" y="${y+5}" text-anchor="middle" class="chart-number" style="font-size:13px">${p.mean??'—'}</text><text x="${x}" y="${i===3?y-r-14:y+r+16}" text-anchor="middle" class="chart-label">${esc(p.name)}</text><title>${esc(p.name)}；${p.n??'隐藏'} 名学生，最新练习均分 ${p.mean??'隐藏'} 分</title></g></g>`;
 }
 $('galaxy').innerHTML=svg(640,345,s,'课程知识点及练习归属星图');$('galaxy').querySelectorAll('[data-point]').forEach(el=>{const pick=()=>{focus=el.dataset.point;galaxy(c);const p=c.points.find(p=>p.id===focus);$('knowledge-status').textContent=`${p.name} · 最新练习均分 ${p.mean??'隐藏'} 分 · 覆盖 ${p.n??'隐藏'} 人 · 2 道练习`;};el.addEventListener('click',pick);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();$('galaxy').querySelector(`[data-point="${focus}"]`)?.focus();}});});
}
function terrain(c){
 let s='<defs><linearGradient id="pillar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bcb0e0" stop-opacity=".8"/><stop offset="1" stop-color="#d9d4e8" stop-opacity=".25"/></linearGradient></defs>',totals={reading:0,video:0,practice:0};
 const ordered=[...c.calendar].sort((a,b)=>(a.week+a.weekday)-(b.week+b.weekday)||a.week-b.week);
 for(const d of ordered){if(d.kinds)for(const k of Object.keys(totals))totals[k]+=d.kinds[k]||0;const x=143+(d.week-1)*27-d.weekday*17,y=116+(d.week-1)*5+d.weekday*15,w=23,deep=12,h=d.count===null?0:Math.log1p(d.count)/Math.log1p(data.calendarMax)*107;
 s+=`<g><title>${d.date}，周${d.week}；${d.count===null?'小样本隐藏':`${d.count} 次活动，${d.learners} 人；模拟活动时长 ${d.minutes} 分钟`}</title><path d="M${x},${y-h} l${w},6 l-${deep},8 l-${w},-6 Z" fill="${d.count===null?'#ddd':`rgba(118,102,204,${.12+h/170})`}" stroke="#fff" stroke-opacity=".65" stroke-width=".6"/><path d="M${x},${y-h} l${w},6 v${h} l-${w},-6 Z" fill="url(#pillar)" stroke="#b5a8d01a" stroke-width=".5"/><path d="M${x+w},${y-h+6} l-${deep},8 v${h} l${deep},-8 Z" fill="#7666cc" opacity="${.06+h/500}"/></g>`;
 }
 s+=`<text x="75" y="255" class="small-label">周一</text><text x="12" y="310" class="small-label">周日</text><text x="33" y="296" class="chart-label">第01周</text><text x="474" y="328" class="chart-label">第16周</text><text x="402" y="31" class="small-label">活动量：低 → 高</text><text x="402" y="48" class="small-label">统一对数高度，非线性</text>`;
 $('terrain').innerHTML=svg(640,345,s,'16周每天活动次数的等距投影地形');const total=Object.values(totals).reduce((a,b)=>a+b,0);$('activity-kinds').innerHTML=Object.entries({reading:'阅读',video:'视频',practice:'练习提交'}).map(([k,label])=>`<span>${label}<b>${total?(totals[k]/total*100).toFixed(1):0}%</b></span>`).join('');
}
function trajectory(c){
 const x=i=>67+i*165,y=value=>270-value*2.18;let s='';
 for(const v of [0,60,100])s+=`<line x1="55" x2="602" y1="${y(v)}" y2="${y(v)}" class="grid-line" ${v===60?'stroke-dasharray="3 5"':''}/><text x="37" y="${y(v)+3}" text-anchor="end" class="small-label">${v}</text>`;
 const values=c.phases.map((p,i)=>({...p,i})).filter(p=>p.mean!==null);
 if(values.length){const upper=values.map(p=>`${x(p.i)},${y(p.q75)}`).join(' L'),lower=[...values].reverse().map(p=>`${x(p.i)},${y(p.q25)}`).join(' L');s+=`<path d="M${upper} L${lower} Z" fill="#c9bee7" fill-opacity=".24" stroke="#c9bee7" stroke-opacity=".15"/>`;let segments=[];for(let i=0;i<4;i++){const p=c.phases[i];if(p.mean===null){if(segments.length){s+=`<path d="${segments.join(' ')}" fill="none" stroke="#7666cc" stroke-width="2"/>`;segments=[];}continue;}segments.push(`${segments.length?'L':'M'}${x(i)},${y(p.mean)}`);}if(segments.length)s+=`<path d="${segments.join(' ')}" fill="none" stroke="#7666cc" stroke-width="2"/>`;}
 for(let i=0;i<4;i++){const p=c.phases[i];s+=`<text x="${x(i)}" y="300" text-anchor="middle" class="chart-label">${p.name}</text><text x="${x(i)}" y="317" text-anchor="middle" class="small-label">${p.n} 人有分</text>`;if(p.mean!==null)s+=`<circle cx="${x(i)}" cy="${y(p.mean)}" r="12" fill="#7666cc" fill-opacity=".07"/><circle cx="${x(i)}" cy="${y(p.mean)}" r="4" fill="#fff" stroke="#7666cc" stroke-width="1.6"/><text x="${x(i)}" y="${y(p.mean)-19}" text-anchor="middle" class="chart-number" style="font-size:14px">${p.mean}</text>`;}
 $('trajectory').innerHTML=svg(640,345,s,'四次阶段测评的均分和25至75百分位区间');$('phase-counts').textContent='0—100分';
}
function render(name){current=data.courses.find(c=>c.name===name)||data.courses[0];focus=null;$('students').textContent=current.n;$('activity').textContent=fmt(current.activityTotal);$('scope-note').textContent=`${data.term} · 全期选课均分 ${current.sourceMean} 分`;flow(current);galaxy(current);terrain(current);trajectory(current);$('knowledge-status').textContent='点选知识点，查看练习得分与覆盖样本。';}
$('course').innerHTML=data.courses.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');$('course').value=data.courses.some(c=>c.name==='数据结构')?'数据结构':data.courses[0].name;$('course').addEventListener('change',e=>render(e.target.value));$('reset-focus').addEventListener('click',()=>{focus=null;galaxy(current);$('knowledge-status').textContent='点选知识点，查看练习得分与覆盖样本。';});render($('course').value);
</script></body></html>
