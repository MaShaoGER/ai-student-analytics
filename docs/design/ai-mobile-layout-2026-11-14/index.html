<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学析台 · 手机排版样例</title>
<style>
:root{color-scheme:light;--paper:#f5f5f2;--ink:#232329;--muted:#6b6b76;--line:#24243626;--purple:#7666cc;--soft:#e6e1f4;font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit}button{color:inherit;cursor:pointer;border-radius:0;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.symbols{display:none}
.app{position:relative;width:100%;max-width:480px;height:100svh;height:100dvh;min-height:360px;margin:0 auto;overflow:hidden;background:var(--paper)}
.header{position:relative;z-index:3;padding:8px 16px 0;background:var(--paper);border-bottom:1px solid var(--line)}.masthead{height:40px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:650;letter-spacing:-.04em}.brand svg{width:25px;height:29px;stroke-width:1.8}.actions{display:flex;align-items:center;gap:0}.icon-button{display:grid;place-items:center;width:40px;height:40px;border:0;background:none}.avatar span{display:grid;place-items:center;width:29px;height:29px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:600}.navigation{height:48px;display:flex;align-items:center;gap:4px}.tab{height:34px;display:flex;align-items:center;gap:6px;padding:0 12px;border:0;background:transparent;color:var(--muted);font-size:13px}.tab svg{width:16px;height:16px}.tab.active{background:var(--ink);color:var(--paper)}.history{margin-left:auto;display:flex;align-items:center;gap:6px;padding:0 2px 0 10px;height:40px;font-size:12px;color:var(--muted);background:none;border:0}.history svg{width:17px;height:17px}
.main{height:calc(100% - 97px);overflow-y:auto;overscroll-behavior:contain;padding:38px 22px 170px;scrollbar-width:thin}.intro-mark{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;letter-spacing:.05em;margin:0 0 12px}.intro-mark svg{width:15px;height:15px;color:var(--purple)}h1{font-size:30px;line-height:1.35;font-weight:600;letter-spacing:-.045em;margin:0} .intro p{color:var(--muted);font-size:14px;line-height:1.6;margin:10px 0 0}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:28px}.question{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;min-height:96px;padding:14px;border:1px solid var(--line);background:transparent;text-align:left}.question.recommended{background:#eeecf4;border-color:#7666cc55}.question-top{width:100%;display:flex;align-items:center;justify-content:space-between;color:var(--purple)}.question-top svg{width:19px;height:19px}.question .arrow{color:var(--muted);width:15px;height:15px}.question strong{font-size:15px;font-weight:550;line-height:1.45}.recommended-label{font-size:10px;line-height:1.4;color:#57489f;margin-left:auto;margin-right:7px}.question:hover{border-color:#7666cc88}.sample-note{margin:18px 0 0;font-size:10px;line-height:1.6;color:var(--muted)}
.composer-wrap{position:absolute;z-index:2;bottom:0;left:0;right:0;padding:12px 16px max(16px,env(safe-area-inset-bottom));background:var(--paper)}.composer{padding:12px 12px 10px;border:1px solid #24243642;background:var(--paper)}.composer:focus-within{border-color:var(--purple)}textarea{display:block;width:100%;height:43px;max-height:96px;resize:none;overflow-y:auto;background:transparent;border:0;border-radius:0;padding:0;color:var(--ink);font-size:16px;line-height:1.5;outline:none}textarea::placeholder{color:var(--muted);opacity:.85}textarea:focus-visible{outline:none}.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px}.composer-meta{display:flex;align-items:center;gap:6px;color:var(--muted)}.composer-meta .icon-button{width:34px;height:34px;margin-left:-7px}.composer-hint{font-size:11px}.send-group{display:flex;align-items:center;gap:12px}.counter{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.send{display:grid;place-items:center;width:38px;height:38px;border:0;background:var(--ink);color:var(--paper)}.send:disabled{background:#23232926;color:#23232966;cursor:default}.send svg{width:20px;height:20px}.live-note{font-size:12px;color:var(--muted);line-height:1.6;margin:18px 0 0;min-height:20px}.live-note:empty{display:none}
.popover{position:absolute;z-index:5;top:91px;right:16px;width:min(290px,calc(100% - 32px));padding:17px;background:#fbfbf8;border:1px solid var(--line);box-shadow:0 12px 32px #24243618}.popover[hidden]{display:none}.popover h2{font-size:15px;margin:0 0 12px;font-weight:600}.popover p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}.popover button{min-height:40px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);font-size:13px}.popover button:first-of-type{border-top:0}.popover .close{margin-top:14px;text-align:center;border:1px solid var(--line)}
@media(min-width:600px){body{background:#e9e9e4}.app{border-inline:1px solid var(--line)}}
@media(max-width:350px){.header{padding-inline:12px}.main{padding-inline:18px}h1{font-size:27px}.tab{padding-inline:9px}.question{padding:12px}.question strong{font-size:14px}.recommended-label{font-size:9px;margin-right:3px}.composer-wrap{padding-inline:12px}.composer-hint{display:none}}
@media(max-height:650px){.header{padding-top:4px}.masthead{height:36px}.navigation{height:44px}.main{height:calc(100% - 85px);padding-top:16px;padding-bottom:145px}.intro-mark{display:none}h1{font-size:26px}.intro p{margin-top:6px;font-size:13px}.questions{margin-top:18px;gap:8px}.question{min-height:73px;padding:10px 12px}.question-top svg{width:16px;height:16px}.sample-note{margin-top:12px}.composer-wrap{padding-top:8px;padding-bottom:10px}textarea{height:32px;font-size:15px}.composer{padding:10px}.composer-tools{padding-top:2px}.send{width:34px;height:34px}}
</style>
</head>
<body>
<svg class="symbols" aria-hidden="true"><defs>
<symbol id="chart" viewBox="0 0 24 24"><path d="M4 20h16M6 16V9m6 7V4m6 12V7"/></symbol>
<symbol id="spark" viewBox="0 0 24 24"><path d="m11 3 2.4 6.6L20 12l-6.6 2.4L11 21l-2.4-6.6L2 12l6.6-2.4L11 3Zm8-2 1 2.6L23 5l-3 1-1 3-1-3-3-1 3-1.4L19 1Z"/></symbol>
<symbol id="report" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Zm8 0v5h4M9 12h6m-6 4h6"/></symbol>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="history" viewBox="0 0 24 24"><path d="M3 4h14v11H8l-5 4V4Zm17 5v11h-8"/></symbol>
<symbol id="line" viewBox="0 0 24 24"><path d="M4 3v17h17M7 14l4-5 4 2 5-7"/></symbol>
<symbol id="distribution" viewBox="0 0 24 24"><path d="M3 20h18M6 16v-3m4 3V8m4 8V4m4 12V9"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="m10 7 2-2a5 5 0 0 1 7 7l-3 3a5 5 0 0 1-7 0m5 2-2 2a5 5 0 0 1-7-7l3-3a5 5 0 0 1 7 0"/></symbol>
<symbol id="diagonal" viewBox="0 0 24 24"><path d="M5 19 19 5M7 5h12v12"/></symbol>
<symbol id="send" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</defs></svg>
<div class="app">
<header class="header">
 <div class="masthead">
  <div class="brand"><svg viewBox="0 0 28 30" aria-hidden="true"><path d="M3 26h23M6 23V16m6 7V10m6 13V4m6 19V12"/><circle cx="18" cy="3" r="1.7" fill="#7666cc" stroke="none"/></svg><span>学析台</span></div>
  <div class="actions"><button class="icon-button" aria-label="分析报告" data-demo="分析报告入口保留；本样例不读取分析结果。"><svg aria-hidden="true"><use href="#report"/></svg></button><button id="menuToggle" class="icon-button" aria-label="打开工具" aria-expanded="false"><svg aria-hidden="true"><use href="#menu"/></svg></button><button class="icon-button avatar" aria-label="账号与偏好" data-demo="账号与偏好入口保留；本样例不访问账号。"><span>系</span></button></div>
 </div>
 <nav class="navigation" aria-label="工作台导航"><button class="tab" data-demo="当前仅预览 AI 对话的手机排版。"><svg aria-hidden="true"><use href="#chart"/></svg>数据浏览</button><button class="tab active" aria-current="page"><svg aria-hidden="true"><use href="#spark"/></svg>AI 对话</button><button id="historyToggle" class="history" aria-expanded="false"><svg aria-hidden="true"><use href="#history"/></svg>历史</button></nav>
</header>
<main class="main">
 <section class="intro" aria-labelledby="welcome"><div class="intro-mark"><svg aria-hidden="true"><use href="#spark"/></svg>学习分析助手</div><h1 id="welcome">今天想看清什么？</h1><p>先看整体，再深入分析。</p></section>
 <div class="questions" aria-label="推荐问题">
  <button class="question recommended" data-question="比较各课程平均成绩。"><span class="question-top"><svg aria-hidden="true"><use href="#chart"/></svg><span class="recommended-label">建议先看</span><svg class="arrow" aria-hidden="true"><use href="#diagonal"/></svg></span><strong>课程成绩</strong></button>
  <button class="question" data-question="各学期平均成绩如何？"><span class="question-top"><svg aria-hidden="true"><use href="#line"/></svg><svg class="arrow" aria-hidden="true"><use href="#diagonal"/></svg></span><strong>学期变化</strong></button>
  <button class="question" data-question="查看课程成绩分布。"><span class="question-top"><svg aria-hidden="true"><use href="#distribution"/></svg><svg class="arrow" aria-hidden="true"><use href="#diagonal"/></svg></span><strong>成绩分布</strong></button>
  <button class="question" data-question="缺勤次数和成绩有关系吗？"><span class="question-top"><svg aria-hidden="true"><use href="#link"/></svg><svg class="arrow" aria-hidden="true"><use href="#diagonal"/></svg></span><strong>出勤关联</strong></button>
 </div>
 <p class="sample-note">排版样例 · 不连接账号、数据或 AI 服务</p>
 <p id="status" class="live-note" role="status"></p>
</main>
<div id="historyPanel" class="popover" hidden><h2>历史对话</h2><p>历史入口收在导航右侧，不再单独占一行。样例不加载账号记录。</p><button class="close" data-close>关闭</button></div>
<div id="menuPanel" class="popover" hidden><h2>工具</h2><button data-demo="保留现有数据源与口径说明。">数据源与口径</button><button data-demo="保留现有账号与偏好设置。">账号与偏好</button><button class="close" data-close>关闭</button></div>
<footer class="composer-wrap"><form class="composer" id="composer"><textarea id="question" aria-label="输入分析问题" placeholder="想了解哪些学习情况？" maxlength="500" rows="2"></textarea><div class="composer-tools"><div class="composer-meta"><button type="button" class="icon-button" aria-label="新对话" id="newChat"><svg aria-hidden="true"><use href="#plus"/></svg></button><span class="composer-hint">新对话</span></div><div class="send-group"><span class="counter" id="count">0 / 500</span><button class="send" id="sendButton" aria-label="发送" disabled><svg aria-hidden="true"><use href="#send"/></svg></button></div></div></form></footer>
</div>
<script>
const input=document.querySelector('#question'),count=document.querySelector('#count'),send=document.querySelector('#sendButton'),status=document.querySelector('#status');
function update(){count.textContent=input.value.length+' / 500';send.disabled=input.value.trim().length<2}input.addEventListener('input',update);
document.querySelectorAll('[data-question]').forEach(button=>button.addEventListener('click',()=>{if(input.value.trim()&&input.value!==button.dataset.question&&!confirm('替换当前样例草稿？'))return;input.value=button.dataset.question;update();input.focus()}));
document.querySelector('#composer').addEventListener('submit',event=>{event.preventDefault();if(send.disabled)return;status.textContent='这里只预览排版，不会发送真实问题。';input.focus()});
document.querySelector('#newChat').addEventListener('click',()=>{if(input.value.trim()&&!confirm('清除当前样例草稿？'))return;input.value='';status.textContent='';update();input.focus()});
function closePanels(){document.querySelectorAll('.popover').forEach(p=>p.hidden=true);document.querySelectorAll('[aria-expanded]').forEach(b=>b.setAttribute('aria-expanded','false'))}
for(const [triggerId,panelId] of [['historyToggle','historyPanel'],['menuToggle','menuPanel']]){const trigger=document.getElementById(triggerId),panel=document.getElementById(panelId);trigger.addEventListener('click',()=>{const opening=panel.hidden;closePanels();panel.hidden=!opening;trigger.setAttribute('aria-expanded',String(opening));if(opening)panel.querySelector('button').focus()})}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closePanels));document.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{closePanels();status.textContent=b.dataset.demo}));document.addEventListener('keydown',event=>{if(event.key==='Escape'){const id=!document.getElementById('historyPanel').hidden?'historyToggle':'menuToggle';closePanels();document.getElementById(id).focus()}});document.addEventListener('click',event=>{if(!event.target.closest('.popover,#historyToggle,#menuToggle'))closePanels()});
</script>
</body>
</html>
